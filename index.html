<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Data</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Student Data</h1>

      <div class="form-box">
        <input type="text" id="inname" placeholder="Enter your Name" />
        <input type="number" id="inage" placeholder="Enter Your Age" />
        <button onclick="add()">Add</button>
      </div>

      <p class="hint">Double-click a row to delete it</p>
      <div id="toast"></div>

      <table id="root"></table>
    </div>

    <script>
      let data = [];
      let root = document.getElementById("root");

      let add = () => {
        let inName = document.getElementById("inname").value.trim();
        let inAge = document.getElementById("inage").value.trim();

        if (inName === "" || inAge === "") {
          showToast("Please enter both Name and Age");
          return false;
        }

        data.push({ inName, inAge });
        renderTable();

        document.getElementById("inname").value = "";
        document.getElementById("inage").value = "";
      };

      let generateElements = () => {
        let addRow = document.createElement("tr");
        let addCol1 = document.createElement("td");
        let addCol2 = document.createElement("td");

        return { addRow, addCol1, addCol2 };
      };

      let renderTable = () => {
        root.innerHTML = "<tr><th>Name</th><th>Age</th></tr>";

        for (let i of data) {
          let { addRow, addCol1, addCol2 } = generateElements();

          addCol1.innerText = i.inName;
          addCol2.innerText = i.inAge;

          addRow.appendChild(addCol1);
          addRow.appendChild(addCol2);

          addRow.addEventListener("dblclick", () => {
            let index = data.indexOf(i);
            data.splice(index, 1);
            renderTable();
          });

          root.appendChild(addRow);
        }
      };
      let showToast = (message) => {
        let toast = document.getElementById("toast");

        toast.innerText = message;
        toast.classList.add("show");

        setTimeout(() => {
          toast.classList.remove("show");
        }, 3000);
      };
    </script>
  </body>
</html>
